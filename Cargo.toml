[workspace]
# CMS Rust Workspace
#
# This workspace contains the Rust backend for CMS, a modern documentation platform.
#
# Architecture:
# - cms-*: Library crates (entity, db, biz, api, middleware, etc.)
# - cms-server: Binary crate (composition root)
#
# Layering:
#   API Layer (cms-api) → Biz Layer (cms-biz) → DB Layer (cms-db)
#   No circular dependencies allowed
#
# Deployment:
# - Single AWS Windows machine (no Docker)
# - In-process auth (no GoTrue)
# - Pluggable backends: local-disk/S3, memory/Redis, Postgres/ClickHouse
# - Search: embedded Tantivy FTS + in-process vector embeddings (fastembed), per-project isolated

members = [
  "crates/cms-config",
  "crates/cms-error",
  "crates/cms-entity",
  "crates/cms-db",
  "crates/cms-auth",
  "crates/cms-authz",
  "crates/cms-authz-gate",
  "crates/cms-api-keys",
  "crates/cms-mfa",
  "crates/cms-oauth",
  "crates/cms-storage",
  "crates/cms-search",
  "crates/cms-queue",
  "crates/cms-analytics",
  "crates/cms-mcp",
  "crates/cms-biz",
  "crates/cms-sites",
  "crates/cms-api",
  "crates/cms-worker",
  "crates/cms-middleware",
  "crates/cms-mailer",
  "crates/cms-i18n",
  "crates/cms-seed",
  "apps/api",
  "apps/docs",
]
resolver = "2"

[workspace.dependencies]
# Internal dependencies (path-based)
cms-config = { path = "crates/cms-config" }
cms-error = { path = "crates/cms-error" }
cms-i18n = { path = "crates/cms-i18n" }
cms-entity = { path = "crates/cms-entity" }
cms-db = { path = "crates/cms-db" }
cms-auth = { path = "crates/cms-auth" }
cms-authz = { path = "crates/cms-authz" }
cms-authz-gate = { path = "crates/cms-authz-gate" }
cms-api-keys = { path = "crates/cms-api-keys" }
cms-mfa = { path = "crates/cms-mfa" }
cms-oauth = { path = "crates/cms-oauth" }
cms-storage = { path = "crates/cms-storage" }
cms-search = { path = "crates/cms-search" }
cms-queue = { path = "crates/cms-queue" }
cms-analytics = { path = "crates/cms-analytics" }
cms-mcp = { path = "crates/cms-mcp" }
cms-biz = { path = "crates/cms-biz" }
cms-sites = { path = "crates/cms-sites" }
cms-api = { path = "crates/cms-api" }
cms-worker = { path = "crates/cms-worker" }
cms-middleware = { path = "crates/cms-middleware" }
cms-mailer = { path = "crates/cms-mailer" }
cms-seed = { path = "crates/cms-seed" }

# External dependencies (versioned)
# HTTP & Web
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "limit", "trace", "compression-full", "fs", "sensitive-headers", "catch-panic", "timeout", "set-header"] }
tokio = { version = "1.53.1", features = ["full"] }
hyper = "1.11.1"
http = "1.5.0"
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0", features = ["chrono-impl", "uuid-impl", "serde-json-impl", "no-serde-warnings"] }

# Database
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "sqlite", "macros", "migrate", "chrono", "uuid", "json", "runtime-tokio", "tls-native-tls"] }

# Time & UUID
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

# Logging & Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# Configuration
config = { version = "0.15.25", features = ["toml"] }

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.20"
async-trait = "0.1.92"

# Utilities
bytes = "1.12.1"
pulldown-cmark = "0.13.4"
ammonia = "4.2.3"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-onig"] }
validator = { version = "0.21.0", features = ["derive"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid", "yaml"] }
parking_lot = "0.12.5"
mockall = "0.15.0"
tempfile = "3.27.0"
clap = { version = "4.5", features = ["derive", "env"] }
rust-embed = "8.6"
mime_guess = "2.0"
ipnet = "2.12"
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server", "transport-io"] }
schemars = "1.0"

# Authentication
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
argon2 = "0.6.0"
sha2 = "0.11.1"
hex = "0.4.3"
base64 = "0.23.1"
serde_urlencoded = "0.7.1"
urlencoding = "2.1.3"
idna = "1.1.0"
rand = "0.10.3"
subtle = "2.6.1"
getrandom = { version = "0.4.3", features = ["std"] }
totp-rs = { version = "6.0.0", features = ["otpauth", "qr"] }

# Production-ready infrastructure
governor = "0.10.4"
moka = { version = "0.12", features = ["future"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"

# Email
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }
minijinja = { version = "3.0.0", features = ["json"] }

# HTTP client (Git sync API calls)
reqwest = { version = "0.13.5", features = ["json", "rustls", "query", "form"], default-features = false }

# Export generation
printpdf = { version = "0.12.8" }
epub-builder = { version = "0.8.3" }
tar = "0.4.44"
flate2 = "1.1.0"

# Optional & feature dependencies
aws-sdk-s3 = { version = "1.144.0", features = ["rt-tokio"] }
aws-config = { version = "1.11.0" }
aws-credential-types = { version = "1.3.0" }

# Full-text search (Japanese)
# SudachiDict is compiled into the binary so no dictionary files need to be
# shipped to the server; override with `search.lindera_dict_path` if desired.
lindera = { version = "6.0.0", features = ["embed-sudachidict"] }
tantivy = { version = "0.26.2" }
unicode-normalization = "0.1.25"

# Vector / AI search
fastembed = "7.0.0"

[workspace.metadata]
# Configuration for cargo tools
# This workspace follows layering discipline
# All dependencies flow downward: api → biz → db
# No circular dependencies allowed

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[workspace.lints.rust]
ambiguous_glob_reexports = "allow"
