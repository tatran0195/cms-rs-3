[package]
name = "cms-docs"
version = "0.1.0"
edition = "2021"

[lib]
name = "cms_docs"
path = "src/lib.rs"

[[bin]]
name = "cms-docs"
path = "src/main.rs"

[dependencies]
reqwest = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true, features = ["full", "signal"] }
sqlx = { workspace = true, default-features = false, features = ["sqlite"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
anyhow = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
tantivy = { workspace = true }
cms-search = { path = "../../crates/cms-search", default-features = false }
rmcp = { workspace = true }
schemars = { workspace = true }
self-replace = "1.5"
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
axoupdater = { version = "0.10", default-features = false, features = ["github_releases", "tokio"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
