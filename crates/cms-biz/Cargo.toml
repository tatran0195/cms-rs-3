[package]
name = "cms-biz"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = { workspace = true }
cms-db = { path = "../cms-db" }
cms-entity = { path = "../cms-entity" }
cms-error = { path = "../cms-error" }
cms-config = { path = "../cms-config" }
cms-auth = { path = "../cms-auth" }
cms-storage = { path = "../cms-storage" }
cms-search = { path = "../cms-search" }
cms-queue = { path = "../cms-queue" }
cms-authz = { path = "../cms-authz" }
cms-mailer = { workspace = true }
bytes = { workspace = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
yaml-rust2 = "0.11"
chrono = { workspace = true }
uuid = { workspace = true }

# Markdown rendering (for deployment HTML generation)
pulldown-cmark = { workspace = true }
ammonia = { workspace = true }

# HTTP client for Git provider API calls (GitHub/GitLab REST)
reqwest = { workspace = true }
urlencoding = { workspace = true }

# Transactional email delivery for authentication and invitations
lettre = { workspace = true }

# Export generation
printpdf = { workspace = true }
epub-builder = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }

# Logging & error handling
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
mockall = { workspace = true }

[lints]
workspace = true
