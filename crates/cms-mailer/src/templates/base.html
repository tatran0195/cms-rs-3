<!DOCTYPE html>
<html dir="{{ direction }}" lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  {% if preview %}
  <div style="display:none;font-size:1px;color:#ffffff;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden;">
    {{ preview }}
  </div>
  {% endif %}
</head>
<body style="background-color:#f1f5f9;color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;padding:24px 12px;">
  <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#ffffff;border:1px solid #e2e8f0;border-radius:16px;margin:0 auto;max-width:560px;width:100%;overflow:hidden;">
    <tbody>
      <tr>
        {% if direction == 'rtl' %}
        <td align="right" style="padding:24px 28px;text-align:right;">
        {% else %}
        <td align="left" style="padding:24px 28px;text-align:left;">
        {% endif %}
          <img
            src="{{ (logo_url | default('/brand/technostar-logo.png')) | safe }}"
            alt="{{ brand_name }}"
            height="32"
            style="display:block;height:32px;width:auto;border:0;outline:none;text-decoration:none;font-size:18px;font-weight:750;color:#0f172a;"
          />
        </td>
      </tr>
      <tr>
        <td style="border-top:1px solid #e2e8f0;margin:0;padding:0;font-size:0;line-height:0;"></td>
      </tr>
      <tr>
        {% if direction == 'rtl' %}
        <td align="right" style="padding:32px 28px;text-align:right;">
        {% else %}
        <td align="left" style="padding:32px 28px;text-align:left;">
        {% endif %}
          {% block content %}{% endblock %}
        </td>
      </tr>
      <tr>
        {% if direction == 'rtl' %}
        <td align="right" style="background-color:#f8fafc;padding:18px 28px;border-top:1px solid #e2e8f0;text-align:right;">
        {% else %}
        <td align="left" style="background-color:#f8fafc;padding:18px 28px;border-top:1px solid #e2e8f0;text-align:left;">
        {% endif %}
          <p style="color:#64748b;font-size:12px;line-height:1.55;margin:0;">{{ brand_footer }}</p>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
